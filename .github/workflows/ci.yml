name: CI

on:
  push:
  pull_request:

jobs:
  game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Config check
        run: npm run config:check

      - name: Build
        run: npm run build
